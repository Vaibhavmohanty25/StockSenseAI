[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "stocksense.settings.test"
pythonpath = [".", "backend"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["infrastructure: requires live Redis as well as PostgreSQL"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/stocksense/settings/*.py" = ["F403", "F405"]
